<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensaje del día </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Lora:wght@400;500&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* cambiar los colores y el estilo lol*/
    body { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0;
      font-family: 'Lora', serif; 
      text-align: center; 
      background-color: #f5e4e4; /* fondo cálido */
      padding: 12px; 
      color: grey; /* color azul calido*/
    }
    .contenedor {
      max-width: 600px;
      padding: 40px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      z-index: 10;
    }
    @media (max-width: 480px){
      .contenedor{
        padding: 30px 15px;
        border-radius: 15px;
      }
    }
    
    h1 { 
      font-size: 28px; 
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: 0.5px;
    }
    @media (max-width: 768px) {
      h1{
        font-size: 22px;
      }
    }
    @media (max-width: 480px) {
      h1{
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1 id="frase">Respirando...</h1>
  </div>
  
  <script>
  // agregar todas las frases
    const frases = [
      " Está bien si hoy no puedes con todo. Mañana será otro día y tendrás una nueva oportunidad.",
      " Tu valor como persona no depende de tu productividad de hoy.",
      " Sentir cansancio es una señal de que te estas esforzando, no de que estas fallando.",
      " A veces, el mayor logro del día es simplemente haberlo transitado.",
      " No tienes que tener todas las respuestas ahora mismo. Es normal dudar en el camino.",
      " Un mal resultado no define tu capacidad ni tu futuro. Es solo una parte del proceso.",
      " Tener dudas no significa que no pertenezcas a este lugar.",
      " Detente un minuto. Has llegado lejos y eso ya es un exito en sí mismo.",
      " Aunque no lo veas en los pasillos, muchos compartimos tus mismos miedos. No estás solo/a en esto.",
      " Entregar una solemne y no tener idea de lo que acabas de escribir es una experiencia universal. Lo hecho, hecho está, no lo pienses más.",
      " Respira. Por un segundo, olvida la lista de pendientes y solo siente el aire entrar y salir.",
      " A estas alturas del año, está perfecto si tu mayor logro del día fue simplemente presentarte a clases y sobrevivir.",
      " No hacer nada el fin de semana cuando tienes entregas pendientes da culpa, pero a veces tu cerebro literalmente necesita un descanso para no quemarse.",
      " Revisar las respuestas de la prueba con tus compañeros apenas salen de la sala es tortura psicológica gratuita. Huye de ahí y ve a descansar.",
      " Llorar por frustración académica o sobrecarga es una reacción normal del cuerpo. Bota la rabia, lávate la cara y retoma solo cuando puedas respirar mejor.",
      " Pase lo que pase con los promedios finales, en un par de semanas estarás de vacaciones y la universidad simplemente dejará de existir en tu cabeza por un buen rato.",
      " Está bien odiar profundamente tu carrera en época de exámenes. Es el agotamiento y el estrés hablando, no es una crisis vocacional (probablemente).",
      " Si tu dieta de estos días se basa en completos, sopaipillas o fideos instantáneos, felicidades por mantenerte con vida. Ya habrá tiempo de sobra para comer decente en vacaciones.",
      " El alivio físico que vas a sentir cuando salgas de esa última solemne o examen es real. Literalmente vas a sentir que te quitaron una mochila de cemento de la espalda.",
      " Tu cuerpo está tenso, la espalda duele y tienes unas ojeras tremendas. Es la evidencia del campo de batalla. Pero la guerra ya casi termina, aguanta el último round que falta poco.",
      " Borrar Ucampus apenas entregues el último ensayo es un derecho estudiantil que te ganaste con sudor y lágrimas.",
    ];

    // elige frase al azar matemáticamente
    const fraseAleatoria = frases[Math.floor(Math.random() * frases.length)];
    
    // muestra la frase elegida en la pantalla
    document.getElementById("frase").innerText = fraseAleatoria;

  
  </script>

</body>
</html>
