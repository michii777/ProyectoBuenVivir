<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti</title>
  <style>
    /* cambiar los colores y el estilo lol*/
    body { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0;
      font-family: 'Georgia', serif; 
      text-align: center; 
      background-color: #fdfaf6; /* fondo cálido */
      padding: 20px; 
      color: #606bbf; /* color azul calido*/
    }
    .contenedor {
      max-width: 600px;
      padding: 40px;
      background: #f4e4f5;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h1 { 
      font-size: 28px; 
      font-weight: normal;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1 id="frase">Respirando...</h1>
  </div>

  <script>
    // agregar todas las frases
    const frases = [
      "Skibiddi.",
      "hola.",
      "inserte frase super motivacional.",
      "nose que poner aca.",
      "quiero queque.",
      "advincula.",
      "si lees esto eres exitos@."
    ];

    // elige frase al azar matemáticamente
    const fraseAleatoria = frases[Math.floor(Math.random() * frases.length)];
    
    // muestra la frase elegida en la pantalla
    document.getElementById("frase").innerText = fraseAleatoria;
  </script>

</body>
</html>
